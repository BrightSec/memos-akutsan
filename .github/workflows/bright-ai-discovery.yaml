# Runs the Bright discovery agent in GitHub Copilot CLI: it brings the app up, sets up auth
# and registers the app's endpoints in your Bright project. Output is in the run log.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   secret   BRIGHT_TOKEN     Bright API token with the `bot` scope (the agent runs a Repeater)
#   variable BRIGHT_HOSTNAME  e.g. app.brightsec.com (a leading https:// is fine)
#
# Copilot needs no secret: it uses the built-in GITHUB_TOKEN with `copilot-requests: write`.
# The repo must belong to an organization with Copilot CLI enabled (usage is billed to the org).

name: Bright discovery

on:
  workflow_dispatch:
    inputs:
      extra_instructions:
        description: "Optional hint for the agent, e.g. how to start the app"
        required: false
        default: ""

permissions:
  contents: read
  copilot-requests: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRIGHT_HOSTNAME: ${{ vars.BRIGHT_HOSTNAME }}
      BRIGHT_TOKEN: ${{ secrets.BRIGHT_TOKEN }}
      EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Copilot CLI does not expand ${VAR} in MCP config, so the shell does it here.
      - name: Set up Copilot CLI with Bright plugin and MCP server
        run: |
          npm install -g @github/copilot@1.0.96
          git clone --depth 1 https://github.com/NeuraLegion/bright-ai-plugins "$RUNNER_TEMP/plugins"
          # tolerate "https://host/" in the variable; the agent reads BRIGHT_HOSTNAME too
          HOST="${BRIGHT_HOSTNAME#https://}"; HOST="${HOST%/}"
          echo "BRIGHT_HOSTNAME=$HOST" >> "$GITHUB_ENV"
          copilot mcp add --transport http \
            --header "Authorization: Api-Key $BRIGHT_TOKEN" \
            brightsec "https://$HOST/mcp"

      - name: Run discovery agent
        run: |
          copilot \
            --plugin-dir "$RUNNER_TEMP/plugins/github-copilot" \
            --agent bright-security:bright-discovery \
            --allow-all \
            -p "Discover and register this application's endpoints in Bright. This is a non-interactive CI run: there is no user to ask. $EXTRA_INSTRUCTIONS"
